[project]
name = "studio"
version = "0.0.0"
description = "Studio vidéo autonome : construction (phase 0 : outillage de vérification uniquement)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# tools/ run on the bare system Python (3.11) before `uv sync`: keep explicit version guards.
"tools/*.py" = ["UP036"]
