[project]
name = "studio"
version = "0.0.0"
description = "Studio vidéo autonome : construction (phase 0 : outillage de vérification uniquement)"
requires-python = ">=3.12"
dependencies = [
    "dbos>=2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: needs a reachable Postgres (STUDIO_TEST_PG_URL)",
  "media: needs ffmpeg/ffprobe on PATH",
]

[tool.coverage.run]
source = ["studio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["studio"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# tools/ run on the bare system Python (3.11) before `uv sync`: keep explicit version guards.
"tools/*.py" = ["UP036"]
