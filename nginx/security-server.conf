# =============================================================================
# Twimmo.net - Configuration Nginx - Sécurité serveur
# =============================================================================
# À inclure dans chaque bloc server {} de votre configuration nginx :
#   include /etc/nginx/snippets/security-server.conf;
# =============================================================================

# --- [FIX #7] Masquer la version de nginx ---
server_tokens off;

# --- [FIX #3] Bloquer l'accès aux fichiers cachés (.htaccess, .DS_Store, .git, .svn, .env) ---
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# --- [FIX #12] Bloquer l'accès au module admin par IP ---
# Décommenter et adapter avec votre IP de bureau/VPN
# location /admin {
#     allow YOUR_OFFICE_IP;
#     deny all;
#     return 404;
# }

# Bloquer l'accès aux fichiers de configuration
location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json|\.env|config\.php|\.sql)$ {
    deny all;
    return 404;
}

# Bloquer l'accès aux fichiers de backup
location ~* \.(bak|backup|old|orig|save|swp|tmp)$ {
    deny all;
    return 404;
}
