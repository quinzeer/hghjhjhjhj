# =============================================================================
# Twimmo.net - Configuration Nginx - Sécurisation des cookies
# =============================================================================
# À inclure dans le bloc server {} de prod.twimmo.net :
#   include /etc/nginx/snippets/cookie-security.conf;
# =============================================================================

# --- [FIX #6] Ajouter HttpOnly sur le cookie de session ---
# --- [FIX #8] Changer SameSite=None en SameSite=Lax ---
# --- [FIX #7b] Ajouter Secure sur tous les cookies ---

# Note : La configuration idéale est de modifier les flags côté PHP (php.ini ou code).
# Mais en complément, nginx peut réécrire les headers Set-Cookie via proxy_cookie_flags
# ou via un module tiers (headers-more-nginx-module).

# Si vous utilisez PHP-FPM, ajoutez dans php.ini :
#   session.cookie_httponly = On
#   session.cookie_secure = On
#   session.cookie_samesite = Lax
#   session.cookie_domain = .twimmo.net

# Alternative via headers-more-nginx-module (si installé) :
# more_set_headers "Set-Cookie: $upstream_http_set_cookie; HttpOnly; Secure; SameSite=Lax";

# Si vous utilisez proxy_pass vers PHP-FPM, vous pouvez utiliser :
# proxy_cookie_flags ~ httponly secure samesite=lax;
