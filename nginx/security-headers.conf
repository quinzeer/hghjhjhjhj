# =============================================================================
# Twimmo.net - Configuration Nginx - Headers de sécurité
# =============================================================================
# À inclure dans chaque bloc server {} de votre configuration nginx :
#   include /etc/nginx/snippets/security-headers.conf;
# =============================================================================

# --- [FIX #1] Headers de sécurité HTTP ---

# Force HTTPS pendant 1 an, inclut les sous-domaines
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Protection contre le clickjacking - autorise uniquement l'iframe depuis twimmo.net
add_header X-Frame-Options "SAMEORIGIN" always;

# Empêche le MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Active le filtre XSS des navigateurs
add_header X-XSS-Protection "1; mode=block" always;

# Politique de referrer - n'envoie pas le referrer vers des sites externes
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy - restreint les sources de contenu autorisées
# Adaptée à l'utilisation de Bootstrap CDN, Google Fonts, Google Analytics
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://maxcdn.bootstrapcdn.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://maxcdn.bootstrapcdn.com; img-src 'self' data: https://www.google-analytics.com; frame-src 'self' https://prod.twimmo.net; frame-ancestors 'self' https://www.twimmo.net; connect-src 'self' https://www.google-analytics.com; base-uri 'self'; form-action 'self';" always;

# Restreint les APIs navigateur (caméra, micro, géolocalisation, etc.)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
