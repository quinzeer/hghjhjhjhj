; =============================================================================
; [FIX #6, #7b, #8] Configuration PHP pour sécuriser les sessions
; =============================================================================
; Ajouter ces directives dans votre php.ini ou dans un fichier .user.ini
; à la racine du projet, ou dans la configuration du pool PHP-FPM.
; =============================================================================

; Empêcher JavaScript de lire le cookie de session
session.cookie_httponly = On

; N'envoyer le cookie que sur HTTPS
session.cookie_secure = On

; Protection CSRF - le cookie n'est pas envoyé lors de requêtes cross-site
session.cookie_samesite = Lax

; Domaine du cookie
session.cookie_domain = .twimmo.net

; Utiliser uniquement les cookies pour transmettre l'ID de session (pas d'URL)
session.use_only_cookies = On
session.use_trans_sid = Off

; Régénérer l'ID de session pour éviter la fixation de session
; (à faire aussi dans le code PHP après login : session_regenerate_id(true))

; Durée de vie du cookie de session (14 heures = 50400 secondes)
session.cookie_lifetime = 50400

; Algorithme de hachage fort pour l'ID de session
session.sid_length = 48
session.sid_bits_per_character = 6
