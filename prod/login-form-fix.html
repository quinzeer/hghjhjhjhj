<!--
    =============================================================================
    [FIX #3] Formulaire de login corrigé avec CSRF
    [FIX #4] Politique de mot de passe renforcée (min 8 caractères)
    =============================================================================

    Remplacer le formulaire actuel dans votre template de login par celui-ci.
    Le token CSRF doit être généré côté serveur (voir csrf_helper.php).
-->

<div class="cartouche">
    <form method="post" name="loginForm" action="/" id="loginForm" autocomplete="off">

        <!-- [FIX #3] Token CSRF - à générer côté PHP -->
        <!-- En PHP : <?= CsrfHelper::getHiddenField() ?> -->
        <input type="hidden" name="csrf_token" value="<?= htmlspecialchars($csrfToken, ENT_QUOTES, 'UTF-8') ?>">

        <dt id="login-label">&nbsp;</dt>
        <dd id="login-element">
            <input
                name="login"
                id="login"
                type="text"
                placeholder="VOTRE IDENTIFIANT"
                required
                pattern="^.{5,}$"
                autocomplete="username"
                maxlength="100"
                value="">
        </dd>

        <dt id="mdp-label">&nbsp;</dt>
        <dd id="mdp-element">
            <!--
                [FIX #4] Mot de passe : minimum 8 caractères au lieu de 3
                Le pattern exige au moins :
                - 8 caractères minimum
                Côté serveur, imposez également :
                - 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère spécial
            -->
            <input
                name="mdp"
                id="mdp"
                type="password"
                placeholder="VOTRE MOT DE PASSE"
                required
                pattern="^.{8,}$"
                minlength="8"
                autocomplete="current-password"
                maxlength="128"
                title="Le mot de passe doit contenir au moins 8 caractères"
                value="">
        </dd>

        <dt id="submit-label">&nbsp;</dt>
        <dd id="submit-element">
            <input type="submit" name="submit" value="CONNEXION">
        </dd>
    </form>
</div>

<script type="text/javascript">
    // Soumission du formulaire avec protection
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        var login = document.getElementById('login').value;
        var mdp = document.getElementById('mdp').value;

        if (!login || !mdp) {
            e.preventDefault();
            return false;
        }

        if (mdp.length < 8) {
            e.preventDefault();
            alert('Le mot de passe doit contenir au moins 8 caractères.');
            return false;
        }

        // Désactiver le bouton pour éviter les doubles soumissions
        var submitBtn = this.querySelector('input[type="submit"]');
        submitBtn.disabled = true;
        return true;
    });
</script>
