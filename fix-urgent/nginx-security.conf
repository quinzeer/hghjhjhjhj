# ============================================
# CONFIGURATION NGINX URGENTE - Ma Boite Immo
# A copier dans /etc/nginx/conf.d/ ou inclure
# dans votre bloc server {}
# ============================================

# --- Masquer la version nginx ---
server_tokens off;

# --- Headers de securite ---
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.ma-boite-immo.com https://o4504197474484224.ingest.sentry.io https://api.ipify.org https://www.googletagmanager.com; font-src 'self' data:; frame-ancestors 'none';" always;

# --- Bloquer l'acces aux fichiers sensibles ---
location ~ /\. {
    # Bloque .env, .env.local, .git, .gitignore, etc.
    deny all;
    return 404;
}

location ~* \.(sql|bak|backup|dump|old|orig|save|swp|swo)$ {
    deny all;
    return 404;
}

# --- Bloquer les source maps ---
location ~* \.map$ {
    return 404;
}

# --- Securiser les cookies ---
proxy_cookie_flags SERVERUSED secure httponly samesite=strict;
# Ou mieux, supprimer ce cookie completement :
# proxy_hide_header Set-Cookie;
